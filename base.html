<!doctype html>
<html>
<head>
  <title>College App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">College Portal</span>
  {% if current_user.is_authenticated %}
    <span class="text-white">{{ current_user.name }} ({{ current_user.role }})
      <a class="btn btn-sm btn-light ms-2" href="{{ url_for('logout') }}">Logout</a></span>
  {% endif %}
</nav>
<div class="container mt-4" style="max-width:900px">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="alert alert-{{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
