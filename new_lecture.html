{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h4 class="card-title mb-3">Add Lecture</h4>
    <form method="post">
      <input class="form-control mb-2" name="subject" placeholder="Subject" required>
      <select class="form-select mb-2" name="branch">
        {% for b in branches %}<option>{{ b }}</option>{% endfor %}
      </select>
      <select class="form-select mb-2" name="day">
        {% for d in days %}<option>{{ d }}</option>{% endfor %}
      </select>
      <input class="form-control mb-2" type="time" name="start_time" required>
      <input class="form-control mb-3" name="room" placeholder="Room / venue">
      <button class="btn btn-success">Add</button>
      <a class="btn btn-link" href="{{ url_for('teacher_dashboard') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
