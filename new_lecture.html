{% extends "base.html" %}
{% block content %}
<h3>Add Lecture</h3>
<form method="post">
  <input class="form-control mb-2" name="subject" placeholder="Subject">
  <select class="form-select mb-2" name="branch">
    {% for b in branches %}<option>{{ b }}</option>{% endfor %}
  </select>
  <select class="form-select mb-2" name="day">
    {% for d in days %}<option>{{ d }}</option>{% endfor %}
  </select>
  <input class="form-control mb-2" type="time" name="start_time">
  <input class="form-control mb-2" name="room" placeholder="Room">
  <button class="btn btn-success">Add</button>
  <a href="{{ url_for('teacher_dashboard') }}">Cancel</a>
</form>
{% endblock %}
