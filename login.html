{% extends "base.html" %}
{% block content %}
<h3>Login</h3>
<form method="post">
  <input class="form-control mb-2" name="erp_id" placeholder="ERP / GSource ID">
  <input class="form-control mb-2" type="password" name="password" placeholder="Password">
  <button class="btn btn-primary">Login</button>
  <a href="{{ url_for('register') }}">New user? Register</a>
</form>
{% endblock %}
