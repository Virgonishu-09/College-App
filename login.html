{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:440px">
  <div class="card-body">
    <h4 class="card-title mb-3">Login</h4>
    <form method="post">
      <input class="form-control mb-2" name="erp_id" placeholder="ERP / GSource ID" required>
      <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
      <button class="btn btn-primary">Login</button>
      <a class="ms-2" href="{{ url_for('register') }}">New user? Register</a>
    </form>
  </div>
</div>
{% endblock %}
