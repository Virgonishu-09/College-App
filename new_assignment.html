{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h4 class="card-title mb-3">New Assignment</h4>
    <form method="post" enctype="multipart/form-data">

      <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
      <input class="form-control mb-3" name="title" maxlength="120" required
             placeholder="e.g. Unit 2 - Problem Set">

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Branch <span class="text-danger">*</span></label>
          <select class="form-select" name="branch">
            {% for b in branches %}<option>{{ b }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Due date and time <span class="text-danger">*</span></label>
          <input class="form-control" type="datetime-local" name="due_date" required>
        </div>
      </div>

      <label class="form-label fw-semibold">Attach file <span class="text-muted fw-normal">(optional)</span></label>
      <input class="form-control" type="file" name="file">
      <div class="form-text mb-3">PDF, DOC, DOCX, TXT, PNG, JPG, JPEG or ZIP. Max 10 MB.</div>

      <label class="form-label fw-semibold">Description <span class="text-muted fw-normal">(optional)</span></label>
      <textarea class="form-control mb-3" name="description" rows="4"
                placeholder="What should students do?"></textarea>

      <label class="form-label fw-semibold">Important remarks <span class="text-muted fw-normal">(optional)</span></label>
      <textarea class="form-control mb-3" name="remarks" rows="3"
                placeholder="Things students must keep in mind, e.g. file format, marking scheme, no late submissions"></textarea>

      <button class="btn btn-success">Create Assignment</button>
      <a class="btn btn-link" href="{{ url_for('teacher_dashboard') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
