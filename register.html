{% extends "base.html" %}
{% block content %}
<h3>Register</h3>
<form method="post">
  <input class="form-control mb-2" name="erp_id" placeholder="ERP / GSource ID">
  <input class="form-control mb-2" name="name" placeholder="Full name">
  <input class="form-control mb-2" type="password" name="password" placeholder="Password">
  <select class="form-select mb-2" name="role">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
  </select>
  <input class="form-control mb-2" name="branch"
         placeholder="Branch (teachers: several, e.g. AIML, IT)">
  <input class="form-control mb-2" name="teacher_code" placeholder="Teacher code (teachers only)">
  <button class="btn btn-success">Register</button>
  <a href="{{ url_for('login') }}">Back to login</a>
</form>
{% endblock %}
